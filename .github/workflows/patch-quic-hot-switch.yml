name: patch-quic-hot-switch
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch QUIC hot switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/udp/handler.go')
          s = p.read_text()
          s = s.replace('type udpSession struct {\n\tsnap atomic.Pointer[udpOutbound]', 'type udpSession struct {\n\tflowID uint64\n\tsnap atomic.Pointer[udpOutbound]')
          s = s.replace('\tclosed       atomic.Bool\n}', '\tclosed       atomic.Bool\n\tnextFlowID   atomic.Uint64\n}')
          s = s.replace('func (h *Handler) createUDPSession(ctx context.Context, clientAddr net.Addr, ip string, port int, key udpSessionKey, domain string, firstPayload []byte) (*udpSession, error) {', 'func (h *Handler) createUDPSession(ctx context.Context, clientAddr net.Addr, ip string, port int, key udpSessionKey, domain string, firstPayload []byte) (*udpSession, error) {\n\tflowID := h.nextFlowID.Add(1)')
          s = s.replace('h.routeForeignFallback(ctx, ip, port, domain, key, firstPayload, &sessHolder)', 'h.routeForeignFallback(ctx, ip, port, domain, key, firstPayload, flowID, &sessHolder)')
          s = s.replace('sess := &udpSession{\n\t\ttimeout:', 'sess := &udpSession{\n\t\tflowID:    flowID,\n\t\ttimeout:')
          s = s.replace('func (h *Handler) routeForeignFallback(ctx context.Context, ip string, port int, domain string,\n\tkey udpSessionKey, firstPayload []byte, sessRef **udpSession)', 'func (h *Handler) routeForeignFallback(ctx context.Context, ip string, port int, domain string,\n\tkey udpSessionKey, firstPayload []byte, flowID uint64, sessRef **udpSession)')
          s = s.replace('trialArgs := []any{"target", net.JoinHostPort(ip, strconv.Itoa(port)), "timeout_ms", int(h.quicTimeout / time.Millisecond)}', 'trialArgs := []any{"flow", flowID, "target", net.JoinHostPort(ip, strconv.Itoa(port)), "timeout_ms", int(h.quicTimeout / time.Millisecond)}')
          s = s.replace('args := []any{"target", net.JoinHostPort(ip, strconv.Itoa(port)), "reason", reason}', 'args := []any{"flow", flowID, "target", net.JoinHostPort(ip, strconv.Itoa(port)), "reason", reason}')
          old = '''func (h *Handler) quicFlowDead(sess *udpSession, key udpSessionKey, ip string, port int, sni, reason string) {\n\tif sess == nil {\n\t\treturn\n\t}\n\th.sessionsMu.RLock()\n\t_, present := h.sessions[key]\n\th.sessionsMu.RUnlock()\n\tif !present {\n\t\treturn // 会话已清理(cleaner/reader 退出),不复活它\n\t}\n\told := sess.snap.Load()\n\tif old == nil || old.framed {\n\t\treturn // 早已是代理或已关闭\n\t}\n\t// 写动态黑名单:IP + (抠到的)SNI 域名。SNI 为空(未抠到 / 真 ECH)只写 IP。\n\tif h.router != nil {\n\t\th.router.BlacklistIP(ip, port, "quic:"+reason)\n\t\tif sni != "" {\n\t\t\th.router.BlacklistDomain(sni, port, "quic:"+reason)\n\t\t}\n\t}\n\tpconn, err := h.upstreamMgr.UDPAssociateSelected(context.Background(), ip, port, nil)\n\tif err != nil {\n\t\tslog.Warn("QUIC flow dead but UDP proxy fallback dial failed, staying direct",\n\t\t\t"target", net.JoinHostPort(ip, strconv.Itoa(port)), "error", err)\n\t\treturn\n\t}\n\tsess.snap.Store(&udpOutbound{conn: pconn, framed: true})\n\told.conn.Close() // 解除直连 reader 阻塞;reader 见出向已换 → 续读代理\n\tslog.Info("UDP QUIC flow switched to proxy after blackhole", "target", net.JoinHostPort(ip, strconv.Itoa(port)))\n}'''
          new = '''func (h *Handler) quicFlowDead(sess *udpSession, key udpSessionKey, ip string, port int, sni, reason string) {\n\tif sess == nil {\n\t\treturn\n\t}\n\th.sessionsMu.RLock()\n\t_, present := h.sessions[key]\n\th.sessionsMu.RUnlock()\n\tif !present {\n\t\treturn // 会话已清理(cleaner/reader 退出),不复活它\n\t}\n\told := sess.snap.Load()\n\tif old == nil || old.framed {\n\t\treturn // 早已是代理或已关闭\n\t}\n\tflow := sess.flowID\n\ttarget := net.JoinHostPort(ip, strconv.Itoa(port))\n\tslog.Info("UDP QUIC flow: switching DIRECT -> PROXY", "flow", flow, "target", target, "reason", reason)\n\tif h.router != nil {\n\t\th.router.BlacklistIP(ip, port, "quic:"+reason)\n\t\tif sni != "" {\n\t\t\th.router.BlacklistDomain(sni, port, "quic:"+reason)\n\t\t}\n\t}\n\tctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)\n\tdefer cancel()\n\tslog.Info("UDP QUIC flow: proxy UDP ASSOCIATE start", "flow", flow, "target", target)\n\tpconn, err := h.upstreamMgr.UDPAssociateSelected(upstream.WithFlowID(ctx, flow), ip, port, nil)\n\tif err != nil {\n\t\tslog.Error("UDP QUIC flow: proxy UDP ASSOCIATE failed", "flow", flow, "target", target, "error", err)\n\t\th.dropSession(sess)\n\t\treturn\n\t}\n\tsess.snap.Store(&udpOutbound{conn: pconn, framed: true})\n\told.conn.Close()\n\tslog.Info("UDP QUIC flow: proxy UDP ASSOCIATE success", "flow", flow, "target", target)\n\tslog.Info("UDP QUIC flow switched to proxy after blackhole", "flow", flow, "target", target)\n}'''
          if old not in s:
              raise SystemExit('quicFlowDead block not found')
          s = s.replace(old, new)
          old2 = '''\t\t\tif now.framed {\n\t\t\t\tif _, err := now.conn.Write(fullData); err != nil {\n\t\t\t\t\treturn false\n\t\t\t\t}\n\t\t\t\tProxyBytesUp.Add(int64(len(fullData)))\n\t\t\t}\n\t\t\treturn true'''
          new2 = '''\t\t\tif now.framed {\n\t\t\t\tif _, err := now.conn.Write(fullData); err != nil {\n\t\t\t\t\treturn false\n\t\t\t\t}\n\t\t\t\tProxyBytesUp.Add(int64(len(fullData)))\n\t\t\t\tslog.Debug("UDP QUIC flow: first packet forwarded via proxy", "flow", sess.flowID, "target", net.JoinHostPort(sess.key.targetIP, strconv.Itoa(int(sess.key.targetPort))), "bytes", len(fullData))\n\t\t\t}\n\t\t\treturn true'''
          s = s.replace(old2, new2)
          p.write_text(s)

          p = Path('internal/upstream/manager.go')
          s = p.read_text()
          marker = 'type Manager struct {'
          helper = '''type flowIDContextKey struct{}\n\nfunc WithFlowID(ctx context.Context, id uint64) context.Context {\n\treturn context.WithValue(ctx, flowIDContextKey{}, id)\n}\n\nfunc flowID(ctx context.Context) (uint64, bool) {\n\tid, ok := ctx.Value(flowIDContextKey{}).(uint64)\n\treturn id, ok\n}\n\n'''
          if helper not in s:
              s = s.replace(marker, helper + marker, 1)
          s = s.replace('''\t\tslog.Debug("UDPAssociateSelected: using pre-selected proxy",\n\t\t\t"proxy", MaskProxyURL(selected.URL), "target", fmt.Sprintf("%s:%d", host, port))''', '''\t\targs := []any{"proxy", MaskProxyURL(selected.URL), "target", fmt.Sprintf("%s:%d", host, port)}\n\t\tif id, ok := flowID(ctx); ok { args = append(args, "flow", id) }\n\t\tslog.Debug("UDPAssociateSelected: using pre-selected proxy", args...)''')
          s = s.replace('''\t\t\t\tslog.Debug("UDPAssociateSelected: trying proxy", "proxy", MaskProxyURL(proxy.URL),\n\t\t\t\t\t"target", fmt.Sprintf("%s:%d", host, port))''', '''\t\t\t\targs := []any{"proxy", MaskProxyURL(proxy.URL), "target", fmt.Sprintf("%s:%d", host, port)}\n\t\t\t\tif id, ok := flowID(ctx); ok { args = append(args, "flow", id) }\n\t\t\t\tslog.Debug("UDPAssociateSelected: trying proxy", args...)''')
          s = s.replace('''\t\t\t\tslog.Debug("UDPAssociateSelected: proxy succeeded", "proxy", MaskProxyURL(proxy.URL))''', '''\t\t\t\targs := []any{"proxy", MaskProxyURL(proxy.URL)}\n\t\t\t\tif id, ok := flowID(ctx); ok { args = append(args, "flow", id) }\n\t\t\t\tslog.Debug("UDPAssociateSelected: proxy succeeded", args...)''')
          s = s.replace('''\t\t\t\tslog.Warn("UDPAssociateSelected: proxy failed, trying next",\n\t\t\t\t\t"proxy", MaskProxyURL(proxy.URL), "error", err)''', '''\t\t\t\targs := []any{"proxy", MaskProxyURL(proxy.URL), "error", err}\n\t\t\t\tif id, ok := flowID(ctx); ok { args = append(args, "flow", id) }\n\t\t\t\tslog.Warn("UDPAssociateSelected: proxy failed, trying next", args...)''')
          p.write_text(s)
          PY
          gofmt -w internal/udp/handler.go internal/upstream/manager.go
          go test ./internal/udp ./internal/upstream
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/udp/handler.go internal/upstream/manager.go
          git diff --cached --check
          git commit -m 'fix: make QUIC UDP hot-switch observable and reliable'
          git push