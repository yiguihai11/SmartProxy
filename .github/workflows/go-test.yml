name: go-test

# 轻量 Go 回归:任何 Go 源码改动(含 internal/engine 的端到端回归套件)
# 在 CI 上跑 go test / race / vet / build,防止「改完代码 UDP 又出问题」这类
# 回归(见 docs/e2e-regression.md)。跟 android-build.yml 是两条线:
#   - 本工作流:纯 Go 快速回归,一次 ~1 分钟;
#   - android-build.yml:Android 打包,只在 android/** 等变更时自动跑,
#     Go 内部改动想出新 APK 在 Actions 页手动 Run workflow。
on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-test.yml'
      - 'internal/admin/dashboard.html'  # 面板 UI/JS 变更同样触发回归(含下方 node i18n 冒烟)
      - 'scripts/**'
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-test.yml'
      - 'internal/admin/dashboard.html'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      # -tags with_gvisor 必须带上:TUN 栈(sing-tun gvisor 栈)在这个 tag 下才编译,
      # 不带只编译 stack_gvisor_stub。与 Makefile 的构建配置保持一致,保证 TUN 代码
      # 路径在 CI 上真实被编译、被测到(托管 runner 无 /dev/net/tun 时 TUN 用例自动 Skip,
      # 但编译正确性由本工作流保证)。
      - name: Test (all packages, with coverage)
        run: go test -tags with_gvisor -coverprofile=coverage.out -count=1 ./...

      # 并发热点包再跑一遍 race:engine 端到端回归(直连/代理/ACL/TUN)、
      # relay/udp 计数器与转发、upstream 会话管理。
      - name: Test with race (concurrency-heavy)
        run: go test -tags with_gvisor -race -count=1 ./internal/engine/ ./internal/relay/ ./internal/udp/ ./internal/upstream/

      - name: Vet
        run: go vet -tags with_gvisor ./...

      - name: Build
        run: go build -tags with_gvisor ./...

      # i18n JS 冒烟(面板中英双语):go 先把 en/zh 两变体 dump 成文件(平时跑
      # go test 该测试自动 Skip),node 再真实执行面板 head 的 boot+zhBoot 脚本,
      # 验证 zh 字典安装/t() 全量命中/无 JS 注释泄漏到页面 —— 专防「注释里写裸
      # </head> 导致 zhBoot 注入进注释、boot 源码喷成乱码」这类 Go 字符串测试
      # 抓不到的 JS 层回归(见 scripts/dashboard-i18n.test.js)。
      - name: Dump dashboard en/zh variants
        run: go test -count=1 -run TestDashboardDumpForNodeSmoke ./internal/admin/
        env:
          DASHBOARD_DUMP_DIR: ${{ github.workspace }}/.ci-i18n
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Node smoke test (dashboard i18n JS)
        run: node scripts/dashboard-i18n.test.js "${{ github.workspace }}/.ci-i18n"

      # Codecov 覆盖率徽章的数据源。CODECOV_TOKEN 需在 repo Settings→Secrets and
      # variables→Actions 配好(codecov.io 用 GitHub 登录后在仓库页拿 token)。
      # token 未配时上传失败但不打断本 job(fail_ci_if_error: false),避免外部
      # 服务未就绪把构建卡黄 —— 配好 token 后下一次 Go 改动自动出覆盖率徽章。
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false
