name: Port upstream tethering guard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Port upstream fail-closed guard
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('android/app/src/main/kotlin/io/github/yiguihai11/smartproxy/shizuku/ShizukuTetheringService.kt')
          s = p.read_text()
          replacements = [
              ('import java.util.concurrent.atomic.AtomicInteger\n', 'import java.util.concurrent.atomic.AtomicInteger\nimport java.util.concurrent.atomic.AtomicLong\n'),
              ('    private val wrongUpstreamWarningTypes = AtomicInteger(0)\n', '    private val wrongUpstreamWarningTypes = AtomicInteger(0)\n    private val upstreamRejections = AtomicLong(0)\n'),
              ('    private fun startTetheringTypeAttemptLocked(type: Int, alreadyEnabled: Boolean): Int {\n        val bit = tetheringTypeBit(type)\n', '    private fun startTetheringTypeAttemptLocked(type: Int, alreadyEnabled: Boolean): Int {\n        val rejection = upstreamRejections.get()\n        val bit = tetheringTypeBit(type)\n'),
              ('        if (!awaitProtectedUpstream(expectedUpstream)) {\n', '        if (!awaitProtectedUpstream(expectedUpstream) || rejection != upstreamRejections.get()) {\n'),
              ('''    private fun onTetheringChanged() = runRoutingWork<Unit> {
        enforceProtectedUpstreamLocked()
        notifyStatusChangedLocked()
    }

    private fun enforceProtectedUpstreamLocked() {
        val expected = testInterfaceName ?: return
        val actual = upstreamMonitor?.currentInterfaceNames ?: return
        if (actual.isBlank() || TetheringPlatformCompat.isProtectedUpstream(actual, expected)) return

        val activeTypes = getActiveTetheringTypes()
        val affectedTypes = activeTypes.coerceAtLeast(0) or requestedTetheringTypes or
            (routingSession?.desiredTetheringTypes ?: 0)
        if (affectedTypes == 0) return

        wrongUpstreamWarningTypes.updateAndGet { it or affectedTypes }
        Log.e(TAG, "Android moved tethering to unprotected upstream $actual; stopping downstreams")
        val result = stopActiveTetheringLocked(clearDesired = false, activeTypes = activeTypes)
        if (result != RESULT_OK) {
            Log.e(TAG, "Unable to stop downstreams: $result")
        }
    }
''', '''    private fun onTetheringChanged() {
        stopUnprotectedDownstreams()
        notifyStatusChangedLocked()
    }

    private fun stopUnprotectedDownstreams() {
        val expected = testInterfaceName ?: return
        val actual = upstreamMonitor?.currentInterfaceNames ?: return
        if (actual.isBlank() || TetheringPlatformCompat.isProtectedUpstream(actual, expected)) return

        val activeTypes = upstreamMonitor?.currentInterfaces?.let(::tetheringTypeMask)
            ?: getActiveTetheringTypes()
        val affectedTypes = activeTypes.coerceAtLeast(0) or requestedTetheringTypes or
            (routingSession?.desiredTetheringTypes ?: 0)
        if (affectedTypes == 0) return

        upstreamRejections.incrementAndGet()
        wrongUpstreamWarningTypes.updateAndGet { it or affectedTypes }
        Log.e(TAG, "Android moved tethering to unprotected upstream $actual; stopping downstreams")
        forEachTetheringType(affectedTypes) { type, _ ->
            if (usesPublicTetheringApi()) {
                runCatching {
                    TetheringApi36.requestStopTethering(tetheringManager, type, executor) { result ->
                        if (result != RESULT_OK) Log.e(TAG, "Unable to stop downstream type $type: $result")
                    }
                }.onFailure {
                    Log.e(TAG, "Unable to request stop for downstream type $type", it)
                }
            } else {
                val result = runCatching { TetheringPlatformCompat.stopTethering(tetheringManager, type) }
                    .getOrDefault(RESULT_INTERNAL_ERROR)
                if (result != RESULT_OK) Log.e(TAG, "Unable to stop downstream type $type: $result")
            }
        }
    }
'''),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'expected source fragment not found: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Verify port
        run: |
          grep -n "upstreamRejections" android/app/src/main/kotlin/io/github/yiguihai11/smartproxy/shizuku/ShizukuTetheringService.kt
          grep -n "stopUnprotectedDownstreams" android/app/src/main/kotlin/io/github/yiguihai11/smartproxy/shizuku/ShizukuTetheringService.kt
          grep -n "rejection != upstreamRejections.get()" android/app/src/main/kotlin/io/github/yiguihai11/smartproxy/shizuku/ShizukuTetheringService.kt

      - name: Commit and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/kotlin/io/github/yiguihai11/smartproxy/shizuku/ShizukuTetheringService.kt
          git rm .github/workflows/port-upstream-tethering-guard.yml
          git commit -m 'fix(android): port upstream tethering rejection guard'
          git push
