name: android-cli-build

# Offloads the memory-hungry Gradle build to a GitHub-hosted runner
# (ubuntu-latest: 2-core / 7 GB RAM) instead of a RAM-starved dev box.

on:
  # 路径过滤:只在 Android 相关的文件变更时自动跑,
  # 避免每次纯 Go 提交都烧 Actions 分钟。首次添加本文件也会触发一次冒烟构建。
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'scripts/install-android-cli.sh'
      - 'android/**'
      - 'mobile/android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android CLI
        run: bash ./scripts/install-android-cli.sh

      - name: List project templates
        run: android create --list

      - name: Scaffold a sample project
        run: |
          # Creates a Jetpack Compose + AGP 9 project; the CLI auto-installs
          # the SDK packages the template needs (platforms, build-tools).
          # NOTE: unknown template names still exit 0 with only a stderr error,
          # so do NOT try-and-fallback — use the template name from `create --list`.
          android create empty-activity --name="DemoApp" --output=./demo-app

      - name: Enable R8 for release builds
        working-directory: demo-app
        run: |
          # Template ships `isMinifyEnabled = false` in release{} — flip to true.
          # Fallback: if the line is absent entirely, insert it after `release {`.
          # (Do NOT also insert next to the existing flag — the later assignment wins.)
          # The template's release{} references proguard-rules.pro but does not
          # ship it — R8 fails with "proguard configuration does not exist".
          touch app/proguard-rules.pro
          sed -i 's/isMinifyEnabled[[:space:]]*=[[:space:]]*false/isMinifyEnabled = true/' app/build.gradle.kts
          if ! grep -q 'isMinifyEnabled[[:space:]]*=' app/build.gradle.kts; then
            sed -i '0,/release[[:space:]]*{/s//&\n            isMinifyEnabled = true/' app/build.gradle.kts
          fi
          grep -q 'isMinifyEnabled[[:space:]]*=[[:space:]]*true' app/build.gradle.kts \
            || { echo '::error::failed to enable R8'; exit 1; }
          echo '--- patched release block ---'
          grep -n -A2 'release[[:space:]]*{' app/build.gradle.kts

      - name: Build with Gradle
        working-directory: demo-app
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: demo-app-apks
          path: |
            demo-app/app/build/outputs/apk/debug/*.apk
            demo-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
