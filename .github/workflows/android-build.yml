name: android-build

# Builds the real Android app (android/) with the Go engine embedded as a
# gomobile AAR. Offloaded to a GitHub-hosted runner (2-core / 7 GB) because the
# dev box has too little RAM for Gradle.

on:
  # 路径过滤:只在 Android / AAR 相关变更时自动跑,避免纯 Go 提交烧 Actions 分钟。
  # Go 引擎内部改动想出新包,在 Actions 页手动 `Run workflow`。
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'scripts/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'mobile/**'
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 全历史 + tags:默认 fetch-depth 1 是浅克隆,git describe 够不着 v* 版本 tag,
          # 版本号会回退成短 commit hash。拉全历史后 VERSION 才能派生出 1.x.y(-N-gHASH)。
          fetch-depth: 0

      # 版本从 git tag 派生(M4):只认 v[0-9]* 发布 tag,排除 backup-* 备份 tag;
      # 无 tag 回退到提交哈希。gradle 用它当 versionName,并取 semver 段当 versionCode。
      - name: Derive version from git tag
        run: |
          echo "VERSION=$(git describe --tags --match 'v[0-9]*' --always --dirty | sed 's/^v//')" >> "$GITHUB_ENV"

      # JDK 21 (LTS):AGP 8.13 / Gradle 8.14 都支持,比 17 新的 LTS。
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # x/mobile@latest 要求 go 跟随 go.mod 的 go directive(当前 1.27),gomobile init
      # 内部又会 `go install gobind@latest`,故工具链必须跟到 1.27,且 gomobile 也用
      # @latest 与之配套(钉老版本 + gobind@latest 会因 go directive 漂移而失败)。
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Install gomobile (latest)
        run: go install golang.org/x/mobile/cmd/gomobile@latest

      # Android SDK 必须先就位:gomobile init 会去找 NDK(build-tools / ndk)。
      - name: Set up Android SDK
        run: |
          set -euxo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          # pipefail 下 `yes | sdkmanager` 会因 yes 收 SIGPIPE(141)而失败,但许可此时已接受,
          # 所以 `|| true` 吞掉即可;真正拦路的包安装行在后面。
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # runner 预置 ANDROID_SDK_ROOT=/usr/local/lib/android/sdk,与我们的 SDK 不同,
          # AGP 会报 "different paths to the SDK" 而拒绝构建。对齐成同一个。
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build Go engine AAR
        run: |
          set -euxo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          # 首次会下载 Android NDK 到 gomobile 缓存(约 1 GB,仅第一次慢)。
          gomobile init
          make android
          mkdir -p android/app/libs
          cp build/smartproxy.aar android/app/libs/smartproxy.aar

      # 固定签名 keystore 随仓库走(android/ci-release.keystore,openssl 产 PKCS12,
      # 密码/别名都是公开的 debug 惯例值)。个人自分发、不上架,要的就是「所有构建同一把
      # key」→ 新版直接覆盖安装,不用先卸载。私钥入库对侧载分发没有信任链可伤;若将来上架
      # 商店,再换成 GitHub Secrets 里的私有 release key(本机 openssl 生成,别再用一次性 key)。
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/ci-release.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android

      - name: Verify signed APKs (per-ABI)
        working-directory: android
        run: |
          ls -l app/build/outputs/apk/release/
          # ABI 分包(对齐 sockstun):每个 ABI 一个签名 APK,无 universal。
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -f "app/build/outputs/apk/release/app-${abi}-release.apk" \
              || { echo "::error::missing per-ABI APK: ${abi}"; exit 1; }
          done
          # 签名一致性检查:APK 实际签名证书的 SHA-256 必须等于固定 keystore 的指纹。
          # 坑:apksigner --print-certs 的指纹是无冒号连续 hex,keytool -list 的是冒号分隔,
          # 两边都剥成 64 位小写 hex 再比。不一致或 APK 没签上 = 覆盖安装必失败,直接判红。
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)"
          APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          CERTS=$("$APKSIGNER" verify --print-certs "$APK" 2>&1) \
            || { echo "$CERTS"; echo "::error::APK 签名验证失败(可能未签名)"; exit 1; }
          echo "$CERTS"
          APK_CERT=$(echo "$CERTS" | grep -i "SHA-256 digest" | grep -oiE "[0-9a-f]{64}" | head -1 | tr 'A-F' 'a-f')
          KS_CERT=$(keytool -list -keystore ci-release.keystore -storepass android -alias androiddebugkey 2>/dev/null \
            | grep -oiE "([0-9a-f]{2}:){31}[0-9a-f]{2}" | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK signing cert:   $APK_CERT"
          echo "Keystore cert:      $KS_CERT"
          [ -n "$APK_CERT" ] && [ "$APK_CERT" = "$KS_CERT" ] \
            || { echo "::error::APK 签名证书与固定 keystore 不一致,覆盖安装会失败!"; exit 1; }
          echo "All 4 per-ABI signed release APKs OK, signing cert pinned"

      # 每个 ABI 一个独立 artifact:Artifacts 页 4 条,用户按设备只下对应那个
      # (~9MB),不用像打成一个 zip 那样为 arm64 也把全量 38MB 拖下来。
      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: smartproxy-arm64-v8a-release-apk
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: smartproxy-armeabi-v7a-release-apk
          path: android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
      - name: Upload APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: smartproxy-x86_64-release-apk
          path: android/app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error
      - name: Upload APK (x86)
        uses: actions/upload-artifact@v7
        with:
          name: smartproxy-x86-release-apk
          path: android/app/build/outputs/apk/release/app-x86-release.apk
          if-no-files-found: error
