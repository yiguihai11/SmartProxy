name: android-build

# Builds the real Android app (android/) with the Go engine embedded as a
# gomobile AAR. Offloaded to a GitHub-hosted runner (2-core / 7 GB) because the
# dev box has too little RAM for Gradle.

on:
  # 路径过滤:只在 Android / AAR 相关变更时自动跑,避免纯 Go 提交烧 Actions 分钟。
  # Go 引擎内部改动想出新包,在 Actions 页手动 `Run workflow`。
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'scripts/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - 'mobile/**'
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # 锁到 go.mod 里 x/mobile 的版本:与本地核对过的生成语义(方法名 lowerFirst、
      # JavaPkgName 派生规则)保持一致,避免 @latest 漂移。
      - name: Install gomobile (pinned to go.mod version)
        run: go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260602190626-68735029466e

      # Android SDK 必须先就位:gomobile init 会去找 NDK(build-tools / ndk)。
      - name: Set up Android SDK
        run: |
          set -euxo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          # pipefail 下 `yes | sdkmanager` 会因 yes 收 SIGPIPE(141)而失败,但许可此时已接受,
          # 所以 `|| true` 吞掉即可;真正拦路的包安装行在后面。
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # runner 预置 ANDROID_SDK_ROOT=/usr/local/lib/android/sdk,与我们的 SDK 不同,
          # AGP 会报 "different paths to the SDK" 而拒绝构建。对齐成同一个。
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build Go engine AAR
        run: |
          set -euxo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          # 首次会下载 Android NDK 到 gomobile 缓存(约 1 GB,仅第一次慢)。
          gomobile init
          make android
          mkdir -p android/app/libs
          cp build/smartproxy.aar android/app/libs/smartproxy.aar

      - name: Generate debug signing keystore
        run: |
          # Throwaway keystore for the temporary signed release build (debug
          # signing convention, no secrets). Signature differs per build —
          # uninstall before installing a newer one.
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=SmartProxy, OU=Dev, O=SmartProxy, L=Beijing, ST=Beijing, C=CN"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/debug.keystore
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android

      - name: Verify signed APKs (per-ABI)
        working-directory: android
        run: |
          ls -l app/build/outputs/apk/release/
          # ABI 分包(对齐 sockstun):每个 ABI 一个签名 APK,无 universal。
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -f "app/build/outputs/apk/release/app-${abi}-release.apk" \
              || { echo "::error::missing per-ABI APK: ${abi}"; exit 1; }
          done
          echo "All 4 per-ABI signed release APKs OK"

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: smartproxy-signed-release-apk
          path: android/app/build/outputs/apk/release/*-release.apk
          if-no-files-found: error
