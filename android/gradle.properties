org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9.4:走内置 Kotlin + 新 DSL(两者 9.x 默认均为 true,这里不写任何 opt-out)。
# Kotlin 支持由 AGP 内置提供,不再 apply org.jetbrains.kotlin.android;
# 但 Compose 编译器插件(org.jetbrains.kotlin.plugin.compose)仍要在 build 脚本里
# 显式 apply——内置 Kotlin 不管它,Kotlin 2.0+ 缺了它构建直接报错。
# KGP 版本在根 build.gradle.kts 的 buildscript classpath 升到 2.4.20
# (内置默认只有 2.2.10,与 R8 9.4 / Compose 编译器 2.4.20 不配套)。
