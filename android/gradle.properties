org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9.x Built-in Kotlin 兼容:保留独立 org.jetbrains.kotlin.android 插件与 Compose 插件控制
android.builtInKotlin=false
# AGP 9.4 默认启用新 DSL(android.newDsl=true),外部 KGP 2.4.20 的 kotlin.android 插件
# 与之不兼容(ApplicationExtensionImpl 无法 cast 为 BaseExtension,配置阶段直接失败,
# 单测/打包连跑都跑不起来)。9.x 阶段先显式关新 DSL,保住独立 KGP + Compose 插件;
# 等后续迁到 built-in Kotlin(android.builtInKotlin=true,删掉 kotlin.android 插件)再开。
android.newDsl=false
